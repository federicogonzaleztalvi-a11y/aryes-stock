<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuadre de fotos · Ahora vs Parejo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#28271f;--gray:#7a7a74;--green:#059669;--sans:'DM Sans',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d8;font-family:var(--sans);color:var(--ink);padding:24px 18px 50px}
  h1{text-align:center;font-size:21px;margin:0 0 4px}
  .sub{text-align:center;color:#6b6b66;font-size:12.5px;margin:0 0 20px}
  .wrap{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
  .colhdr{text-align:center;font-weight:700;font-size:13px;padding-bottom:4px}
  .colhdr .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:6px}
  .pill.bad{background:#fdecec;color:#c0392b}
  .pill.good{background:#e7f6ef;color:#047857}
  .card{background:#fff;border-radius:16px;border:1px solid #f0f0ec;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .imgbox{height:160px;background:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #f6f6f2}
  .now .imgbox img{max-height:132px;max-width:100%;object-fit:contain}
  .fix .imgbox img{max-height:132px;max-width:132px;object-fit:contain}
  .cbody{padding:10px 13px 13px}
  .mk{font-size:10px;color:var(--gray);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .nm{font-size:13px;font-weight:600;margin:3px 0 7px;line-height:1.3}
  .lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#8a897f}
</style>
</head>
<body>
  <h1>Encuadre de fotos · A/B</h1>
  <p class="sub">Misma foto real. Izquierda como está hoy · Derecha con encuadre parejo (estándar Amazon/Shopify).</p>
  <div class="wrap">
    <div class="colhdr">AHORA <span class="pill bad">Desparejo</span></div>
    <div class="colhdr">PAREJO <span class="pill good">Propuesta</span></div>
    <div id="col-now"></div>
    <div id="col-fix"></div>
  </div>
<script>
  const prods = [
    {mk:'Mix', n:'Aromatizante 30 ml', u:'https://mrotnqybqvmvlexncvno.supabase.co/storage/v1/object/public/product-images/aryes-ltda-6223/1791383470317-spidif.png'},
    {mk:'Mix', n:'Azúcar Cristal Colores 80 g', u:'https://mrotnqybqvmvlexncvno.supabase.co/storage/v1/object/public/product-images/aryes-ltda-6223/1791384672867-01nbtk.jpg'},
    {mk:'Mix', n:'Ácido Cítrico 50 g', u:'https://aryes-catalogo.vercel.app/assets/mix-acido-citrico-DFiiFMqF.png'},
    {mk:'Mix', n:'Caramelo Almíbar 7 kg', u:'https://mrotnqybqvmvlexncvno.supabase.co/storage/v1/object/public/product-images/aryes-ltda-6223/1785258430051-9seksu.png'},
  ];
  const card = p => `<div class="card"><div class="imgbox"><img src="${p.u}" alt="${p.n}" loading="eager"></div>
    <div class="cbody"><div class="mk">${p.mk}</div><div class="nm">${p.n}</div><div class="lock">🔒 Solo para clientes</div></div></div>`;
  const stack = arr => arr.map(p=>`<div style="margin-bottom:18px">${card(p)}</div>`).join('');
  document.getElementById('col-now').className='now';
  document.getElementById('col-fix').className='fix';
  document.getElementById('col-now').innerHTML = stack(prods);
  document.getElementById('col-fix').innerHTML = stack(prods);
</script>
</body>
</html>
