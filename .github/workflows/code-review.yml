name: Code Review (Torre de Control · staff engineer)

# Revisa CADA Pull Request apenas se abre o recibe cambios — incluidos los PRs
# que abre solo el agente auto-fix. Es el "staff engineer" del equipo: nadie
# mergea sin review. NO mergea, NO edita, NO bloquea: deja un review en lenguaje
# claro (el que aprueba no programa) con un veredicto y los riesgos ordenados por
# gravedad. La decisión de mergear sigue siendo de Federico (regla de oro de la
# Torre de Control: leer/proponer = solo; actuar con consecuencia = con humano).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Permite re-correr el review a mano desde la pestaña Actions sobre un PR dado.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número de PR a revisar'
        required: true

# Si llegan commits nuevos al mismo PR mientras un review corre, cancela el viejo
# y revisa la última versión. Evita reviews duplicados y gasto al pedo.
concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # No gastamos una corrida de IA revisando PRs de bots (Dependabot). Son subidas
    # de dependencias mecánicas; además la Action de Claude por seguridad se niega a
    # correr disparada por un bot. Los PRs de humanos (vos) SÍ se revisan.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read          # leer el código del repo
      pull-requests: write    # dejar el review/comentario en el PR
      id-token: write         # auth OIDC de la GitHub App de Claude
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # historia completa: el agente necesita diffear contra main

      - uses: anthropics/claude-code-action@v1
        env:
          # gh CLI (pre-instalado en el runner) se autentica solo con este token.
          # Es el token del workflow, independiente del auth de la GitHub App de la
          # Action (que va por OIDC) — por eso NO rompe el gotcha de github_token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Sos el STAFF ENGINEER que revisa este Pull Request. Nivel: mejor que
            cualquier senior que pudieran contratar Apple, Amazon o Shopify —
            porque además conocés a fondo las reglas propias de ESTE proyecto, que
            un recién llegado no sabría. Tu trabajo es proteger la operación de
            Pazque (SaaS B2B multi-tenant EN PRODUCCIÓN con un cliente real, Eric /
            org `aryes-ltda-6223`) y escribirle el review a Federico, que NO
            programa — así que todo hallazgo se explica en lenguaje claro.

            PASO 1 — Contexto. Leé `CLAUDE.md` (reglas críticas del repo) antes de
            nada. Después traé el diff del PR con:
                gh pr diff "$PR_NUMBER"
            y abrí los archivos tocados para entender el cambio en su contexto real
            (no revises a ciegas sobre el diff; leé las funciones completas).

            PASO 2 — Revisá con foco en los INVARIANTES de Pazque (lo más grave
            primero). Marcá cualquier violación como 🔴 CRÍTICO:
              • AISLAMIENTO MULTI-TENANT: toda query debe scopear por `org_id`
                tomado del JWT/sesión, NUNCA del body del request. Cualquier camino
                que pueda filtrar o pisar datos entre organizaciones es lo más grave
                que existe acá.
              • NO ROMPER A ERIC: ¿este cambio puede romper algún flujo vivo (login,
                pedido, precios, catálogo, portal)? ¿Cambia comportamiento del que
                Eric ya depende? ¿Migración de datos destructiva?
              • REGLAS DE DB: para updates se usa `db.patch()`, nunca `db.upsert()`.
                Respetar RLS. Ojo con queries sin filtro que barren toda la tabla.
              • GENÉRICO, NO HARDCODEAR ERIC: ninguna feature nueva debe quedar atada
                a `aryes-ltda-6223`; todo por-org vía config/flags.
              • COPY SELF-SERVE: PROHIBIDO prometer "te armamos el portal / te
                cargamos los productos". Siempre "lo armás/cargás vos en minutos".
              • SEGURIDAD: secretos o API keys hardcodeados; inputs sin validar;
                SQL/command injection; XSS (todo dato de usuario interpolado en HTML
                debe pasar por `esc()`); endpoints sin chequear auth (CRON_SECRET en
                crons, `resolveMember` en APIs por-org); CORS/permisos laxos.

            PASO 3 — Revisá además lo de siempre de un review top: corrección y
            casos borde, manejo de errores (¿falla silencioso? ¿rompe el request?),
            performance (N+1, full-table scans, llamadas en loop), legibilidad,
            y que haya o se ajusten tests si el cambio lo amerita.

            PASO 4 — Publicá UN solo review con `gh pr review "$PR_NUMBER" --comment
            --body-file <archivo>` (escribí el cuerpo a un archivo .md primero).
            Escribilo en ESPAÑOL rioplatense, formato:

              ## 🤖 Review automático — Torre de Control

              **Veredicto:** uno de → ✅ Listo para mergear · ⚠️ Mergeable con
              reparos · 🔴 No mergear todavía

              **Qué hace este PR (en una línea):** ...

              **¿Puede romper algo para Eric?** sí/no + por qué, en lenguaje simple.

              ### Hallazgos
              Por cada uno: severidad (🔴 crítico / 🟠 importante / 🟡 menor /
              💡 sugerencia), archivo:línea, qué está mal, y el fix concreto.
              Si no hay nada que marcar en una severidad, no la inventes.

              ### Lo que está bien
              1-3 cosas que el cambio hace bien (sé honesto, no relleno).

            REGLAS DURAS DE TU ROL:
              • NO edites código, NO hagas commits, NO mergees, NO cierres el PR.
                Sos un revisor: sólo leés y comentás.
              • Sé preciso y accionable; nada de genérico. Si algo está impecable,
                decí ✅ y listo — no inventes problemas para parecer riguroso.
              • Priorizá SIEMPRE lo que afecte a Eric o el aislamiento entre orgs.
          # Config por `settings` (formato settings.json de Claude Code). SÓLO claves
          # válidas: una clave inválida hace que la Action descarte TODO el bloque y
          # el agente quede sin permisos. Permisos de solo-lectura + Bash para gh.
          settings: |
            {
              "model": "claude-opus-4-8",
              "permissions": {
                "defaultMode": "acceptEdits",
                "allow": ["Read", "Grep", "Glob", "Bash"]
              }
            }
